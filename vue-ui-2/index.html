<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <meta name="description" content="Asset Storage"/>
    <meta name="author" content="c8121"/>

    <title>:) Asset Storage</title>
    <link rel="icon" type="image/x-icon" href="ui-assets/favicon.ico"/>

    <link href="css/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="css/boostrap-icons-1.13.1/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="css/app.css" rel="stylesheet"/>
    <link href="css/assets.css" rel="stylesheet"/>

    <script type="importmap">
        {
          "imports": {
            "vue": "./js/vue-3.5.41/vue.esm-browser.js",
            "vue-router": "./js/vue-router-5.2.0/vue-router.esm-browser.prod.js"
          }
        }
    </script>

</head>

<body id="page-top">

<!-- Menu-->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <a class="navbar-brand" href="#page-top">
        <span class="d-block">:) Asset Storage</span>
    </a>
    <form class="d-flex mt-lg-3">
        <div class="input-group ms-lg-2 me-lg-2 mb-lg-2">
            <input class="form-control border-secondary" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
        </div>
    </form>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavMenu"
            aria-controls="mainNavMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavMenu">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        </ul>
    </div>
</nav>


<!-- Content-->
<div class="container-fluid p-0" id="mainContent">

    <section>

        <div id="app">

            <router-view v-slot="{ Component }">
                <component :is="Component" @component-event="componentEvent"/>
            </router-view>

            <div id="toasts" class="position-fixed toast-container top-0 end-0 p-3 mt-5">

                <div ref="activeAssetToast" class="toast show" role="alert" aria-live="assertive" aria-atomic="true"
                     data-bs-delay="15000">
                    <div class="toast-header">
                        <strong class="me-auto">Asset</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        <asset-view :value="activeAsset" @component-event="componentEvent"/>
                    </div>
                </div>

                <div ref="selectedAssetsToast" class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong class="me-auto">Selection</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        <asset-selection-list :value="selectedAssets"/>
                    </div>
                </div>
            </div>

        </div>

        <script type="module">

            import {createApp, ref} from 'vue'
            import {createWebHashHistory, createRouter} from 'vue-router'

            import AssetListView from './js/vue-components/asset-list.vue.js'
            import AssetView from './js/vue-components/asset-view.vue.js'
            import AssetSelectionListView from "./js/vue-components/asset-selection-list.vue.js";

            const routes = [
                {path: '/', component: AssetListView},
            ];

            export const router = createRouter({
                history: createWebHashHistory(),
                routes
            });

            createApp({

                data() {
                    return {
                        activeAsset: null,
                        activeAssetToast: null,
                        selectedAssets: {},
                        selectedAssetsToast: null,
                    }
                },

                methods: {

                    componentEvent(eventName, sender) {
                        console.log(arguments);
                        console.log(sender);
                        switch (eventName) {
                            case 'assetClick': {
                                this.activeAsset = arguments[2];
                                this.setToastVisible(this.activeAssetToast, this.activeAsset !== null);
                                if(sender === 'asset-view') {
                                    window.open('/assets/' + this.activeAsset.Hash);
                                }
                                break;
                            }
                            case 'assetSelect': {
                                const asset = arguments[2];
                                this.selectedAssets[asset.Hash] = asset;
                                this.setToastVisible(this.selectedAssetsToast, Object.keys(this.selectedAssets).length > 0);
                                break;
                            }
                            case 'assetUnselect': {
                                const asset = arguments[2];
                                delete this.selectedAssets[asset.Hash];
                                this.setToastVisible(this.selectedAssetsToast, Object.keys(this.selectedAssets).length > 0);
                                break;
                            }
                        }
                    },

                    setToastVisible(el, visible) {
                        if (!el) return;
                        if (visible) {
                            el.classList.add('show');
                            el.classList.remove('hide');
                        } else {
                            el.classList.add('hide');
                            el.classList.remove('show');
                        }
                    }
                },

                mounted() {
                    this.activeAssetToast = this.$refs["activeAssetToast"];
                    this.setToastVisible(this.activeAssetToast, false);
                    this.selectedAssetsToast = this.$refs["selectedAssetsToast"];
                    this.setToastVisible(this.selectedAssetsToast, false);
                }
            })
                .component('asset-view', AssetView)
                .component('asset-selection-list', AssetSelectionListView)
                .use(router)
                .mount('#app');

        </script>

    </section>

</div>


<!-- Scripts -->
<script src="css/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
