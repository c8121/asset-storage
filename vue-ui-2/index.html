<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <meta name="description" content="Asset Storage"/>
    <meta name="author" content="c8121"/>

    <title>:) Asset Storage</title>
    <link rel="icon" type="image/x-icon" href="ui-assets/favicon.ico"/>

    <link href="css/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="css/boostrap-icons-1.13.1/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="css/app.css" rel="stylesheet"/>
    <link href="css/assets.css" rel="stylesheet"/>

    <script type="importmap">
        {
          "imports": {
            "vue": "./js/vue-3.5.41/vue.esm-browser.js",
            "vue-router": "./js/vue-router-5.2.0/vue-router.esm-browser.prod.js"
          }
        }
    </script>

</head>

<body>

<div id="app">

    <!-- Menu-->
    <nav class="navbar navbar-expand-lg navbar-dark" id="mainNav">
        <a class="navbar-brand" href="#">
            <span class="d-block">:) Asset Storage</span>
        </a>

        <div class="d-flex mt-lg-3">
            <div class="input-group ms-lg-2 me-lg-2 mb-2">
                <input v-model="listFilter.FileName" class="form-control border-secondary" type="search" placeholder="Search" aria-label="Search" @keyup.enter="$refs.listView.loadAssets()">
                <button class="btn btn-outline-secondary" type="submit" @click="$refs.listView.loadAssets()"><i class="bi bi-search"></i></button>
            </div>
        </div>

        <div class="d-flex mt-lg-3">
            <div class="ms-lg-2 me-lg-2 mb-2">
                <select v-model="listFilter.MimeType" class="form-select" @change="$refs.listView.loadAssets()">
                    <option :value="null">All</option>
                    <option value="image/*">Images</option>
                    <option value="video/*">Videos</option>
                    <option :value="null"> - </option>
                    <option v-for="t in mimeTypes" :value="t.Id.toString()">{{t.Name}}</option>
                </select>
            </div>
        </div>

        <div class="d-flex mt-lg-3">
            <div class="ms-lg-2 me-lg-2 mb-2">
                <div class="btn-group dropend">
                    <button type="button" class="btn btn-secondary dropdown-toggle text-wrap text-truncate" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                        <span v-if="pathIdFilter"><i class="bi bi-funnel"></i> {{ pathIdFilter }}</span>
                        <span v-else>Filter Path</span>
                    </button>
                    <div class="dropdown-menu overflow-scroll p-2" style="max-height: 75vh;">
                        <button v-if="listFilter.PathId" class="btn btn-sm btn-secondary m-2" @click="listFilter.PathId = null; pathIdFilter = null; $refs.listView.loadAssets()">
                            <i class="bi bi-funnel text-decoration-line-through"></i>
                            Clear Filter
                        </button>
                        <path-tree @component-event="componentEvent" />
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex mt-lg-3">
            <div class="ms-lg-2 me-lg-2 mb-2">
                <div class="btn-group dropend">
                    <button type="button" class="btn btn-secondary dropdown-toggle text-wrap text-truncate" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                        Upload
                    </button>
                    <div class="dropdown-menu p-2">
                        <upload @component-event="componentEvent" />
                    </div>
                </div>
            </div>
        </div>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavMenu"
                aria-controls="mainNavMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavMenu">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            </ul>
        </div>
    </nav>


    <!-- Content-->
    <div class="container-fluid p-0" id="mainContent">

        <section>

            <router-view v-slot="{ Component }">
                <component ref="listView" :is="Component" @component-event="componentEvent" :filter="listFilter"/>
            </router-view>

            <div id="toasts" class="position-fixed toast-container top-0 end-0 p-3 mt-5">

                <div ref="activeAssetToast" class="toast show" role="alert" aria-live="assertive" aria-atomic="true"
                     data-bs-delay="15000">
                    <div class="toast-header">
                        <strong class="me-auto">Asset</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        <asset-view :value="activeAsset" @component-event="componentEvent"/>
                    </div>
                </div>

                <div ref="selectedAssetsToast" class="toast show" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong class="me-auto">Selection</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        <asset-selection-list :value="selectedAssets"/>
                    </div>
                </div>
            </div>

        </section>

    </div>

</div>

<!-- Main App -->
<script type="module">

    import {createApp, ref} from 'vue'
    import {createWebHashHistory, createRouter} from 'vue-router'

    import AssetListView from './js/vue-components/asset-list.vue.js'
    import AssetView from './js/vue-components/asset-view.vue.js'
    import AssetSelectionListView from "./js/vue-components/asset-selection-list.vue.js";
    import PathTree from "./js/vue-components/path-tree.vue.js";
    import Upload from "./js/vue-components/upload.vue.js";

    const routes = [
        {path: '/', component: AssetListView},
    ];

    export const router = createRouter({
        history: createWebHashHistory(),
        routes
    });

    createApp({

        data() {
            return {
                listFilter: {
                    MimeType: null,
                    FileName: null
                },

                activeAsset: null,
                activeAssetToast: null,
                selectedAssets: {},
                selectedAssetsToast: null,

                mimeTypes: [],

                pathIdFilter: ''
            }
        },

        methods: {

            componentEvent(eventName, sender) {
                switch (eventName) {
                    case 'assetClick': {
                        this.activeAsset = arguments[2];
                        this.setToastVisible(this.activeAssetToast, this.activeAsset !== null);
                        if(sender === 'asset-view') {
                            window.open('/assets/' + this.activeAsset.Hash);
                        }
                        break;
                    }
                    case 'assetSelect': {
                        const asset = arguments[2];
                        this.selectedAssets[asset.Hash] = asset;
                        this.setToastVisible(this.selectedAssetsToast, Object.keys(this.selectedAssets).length > 0);
                        break;
                    }
                    case 'assetUnselect': {
                        const asset = arguments[2];
                        delete this.selectedAssets[asset.Hash];
                        this.setToastVisible(this.selectedAssetsToast, Object.keys(this.selectedAssets).length > 0);
                        break;
                    }
                    case 'assetDownloadClick': {
                        const asset = arguments[2];
                        window.open('/assets/' + asset.Hash);
                        break;
                    }
                    case 'assetPathClick': {
                        const path = arguments[2];
                        this.filterPath(path);
                        break;
                    }
                    case 'pathItemClick': {
                        const path = arguments[2];
                        this.listFilter.FileName = null;
                        this.listFilter.MimeType = null;
                        this.listFilter.PathId = path.Id;
                        this.pathIdFilter = path.Name;
                        this.$refs.listView.loadAssets();
                        break;
                    }
                    default : {
                        console.log("Event not handled: '" + eventName + "', " + arguments.length + " arguments, sender: " + sender);
                        console.log(arguments);
                    }
                }
            },

            setToastVisible(el, visible) {
                if (!el) return;
                if (visible) {
                    el.classList.add('show');
                    el.classList.remove('hide');
                } else {
                    el.classList.add('hide');
                    el.classList.remove('show');
                }
            },

            loadMimeTypes() {
                const self = this;
                const requestOptions = {
                    method: 'GET'
                }
                fetch('/mimetypes/list', requestOptions)
                    .then(res => res.json())
                    .then(json => {
                        self.mimeTypes.splice(0, self.mimeTypes.length);
                        for (const item of json) {
                            self.mimeTypes.push(item);
                        }
                    });
            },

            filterPath(path) {
                const self = this;
                const requestOptions = {
                    method: 'POST',
                    headers: {"Content-Type": "application/x-www-form-urlencoded"},
                    body: "path=" + encodeURI(path)
                }
                fetch('/pathitem/', requestOptions)
                    .then(res => res.json())
                    .then(json => {
                        self.listFilter.FileName = null;
                        self.listFilter.MimeType = null;
                        self.listFilter.PathId = json.Id;
                        self.pathIdFilter = path;
                        self.$refs.listView.loadAssets();
                    });
            }
        },

        mounted() {
            this.activeAssetToast = this.$refs["activeAssetToast"];
            this.setToastVisible(this.activeAssetToast, false);
            this.selectedAssetsToast = this.$refs["selectedAssetsToast"];
            this.setToastVisible(this.selectedAssetsToast, false);

            this.loadMimeTypes();
        }
    })
        .component('asset-view', AssetView)
        .component('asset-selection-list', AssetSelectionListView)
        .component('path-tree', PathTree)
        .component('upload', Upload)
        .use(router)
        .mount('#app');

</script>

<!-- UI Scripts -->
<script src="css/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
