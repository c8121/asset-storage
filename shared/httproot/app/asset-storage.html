<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <meta name="description" content="Asset Storage"/>
    <meta name="author" content="c8121"/>

    <title>:) Asset Storage</title>
    <link rel="icon" type="image/x-icon" href="ui-assets/favicon.ico"/>

    <link href="css/bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="css/boostrap-icons-1.13.1/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="css/app.css" rel="stylesheet"/>
    <link href="css/assets.css" rel="stylesheet"/>

    <script type="importmap">
        {
          "imports": {
            "vue": "./js/vue-3.5.41/vue.esm-browser.js"
          }
        }
    </script>

</head>

<body>

<div id="app"></div>

<!-- Main App -->
<script type="module">

    import {createApp, ref} from 'vue'

    import AssetStorageMain from './js/asset-storage-main.vue.js'

    const response = await fetch(new URL('./js/asset-storage-main.tpl.html', import.meta.url));
    const templateHtml = await response.text();

    AssetStorageMain.template = templateHtml;

    createApp(AssetStorageMain)
        .mount('#app');

</script>

<!-- UI Scripts -->
<script src="css/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
